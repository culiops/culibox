                  <text class="sb" x="833" y="43" font-size="14">AWS</text>
                  <rect class="node" x="1005" y="18" width="170" height="40" rx="3"></rect>
                  <use href="#i-list" x="1021" y="29" width="18" height="18" color="#121923"></use>
                  <text class="sb" x="1047" y="43" font-size="14">Audit log</text>
                  <!-- lifelines -->
                  <path class="life" d="M125 58V414 M370 58V414 M620 58V414 M870 58V414 M1090 58V414"></path>

                  <!-- 1 -->
                  <circle cx="20" cy="100" r="11" fill="#121923"></circle><text class="tm sb wf" x="20" y="104.5" font-size="12" text-anchor="middle">1</text>
                  <rect class="bgs" x="138" y="84" width="270" height="40"></rect>
                  <rect x="119" y="84" width="12" height="34" fill="#f8fafc" stroke="#121923" stroke-width="1.5"></rect>
                  <text class="tm" x="142" y="98" font-size="13">aws sso login --profile acme-sso</text>
                  <text class="mu" x="142" y="116" font-size="13">Your SSO session stays on the host.</text>
                  <!-- 2 -->
                  <circle cx="20" cy="166" r="11" fill="#121923"></circle><text class="tm sb wf" x="20" y="170.5" font-size="12" text-anchor="middle">2</text>
                  <path class="ln" d="M370 166H616" marker-end="url(#hb-ar)"></path>
                  <text class="tm" x="495" y="157" font-size="12.5" text-anchor="middle">aws s3 ls --profile lab-read</text>
                  <text class="mu" x="495" y="185" font-size="12.5" text-anchor="middle">its own socket, no AWS secret</text>
                  <!-- 3 -->
                  <circle cx="20" cy="228" r="11" fill="#121923"></circle><text class="tm sb wf" x="20" y="232.5" font-size="12" text-anchor="middle">3</text>
                  <path class="ln" d="M620 228H866" marker-end="url(#hb-ar)"></path>
                  <text x="745" y="219" font-size="13" text-anchor="middle">assume a read-only role</text>
                  <text class="mu" x="745" y="247" font-size="12.5" text-anchor="middle">a session policy narrows it further</text>
                  <!-- 4 -->
                  <circle cx="20" cy="284" r="11" fill="#121923"></circle><text class="tm sb wf" x="20" y="288.5" font-size="12" text-anchor="middle">4</text>
                  <path class="ln dash" d="M870 284H624" marker-end="url(#hb-ar)"></path>
                  <text class="mu" x="745" y="275" font-size="12.5" text-anchor="middle">temporary credentials</text>
                  <!-- 5 -->
                  <circle cx="20" cy="336" r="11" fill="#121923"></circle><text class="tm sb wf" x="20" y="340.5" font-size="12" text-anchor="middle">5</text>
                  <path class="ln" d="M620 336H374" marker-end="url(#hb-ar)"></path>
                  <rect class="pam" x="426" y="312" width="138" height="18"></rect>
                  <text class="sb amf" x="495" y="325.5" font-size="12.5" text-anchor="middle">expires in 15 min</text>
                  <text class="mu" x="495" y="355" font-size="12.5" text-anchor="middle">write role only in a window you grant</text>
                  <!-- 6 -->
                  <circle cx="20" cy="390" r="11" fill="#121923"></circle><text class="tm sb wf" x="20" y="394.5" font-size="12" text-anchor="middle">6</text>
                  <path class="ln" d="M620 390H1086" marker-end="url(#hb-ar)"></path>
                  <rect class="bgs" x="716" y="368" width="290" height="17"></rect>
                  <text x="861" y="381" font-size="13" text-anchor="middle">mint recorded: session, account, role</text>
                  <rect class="bgs" x="808" y="398" width="106" height="16"></rect>
                  <text class="mu" x="861" y="410" font-size="12.5" text-anchor="middle">never the value</text>
                  <!-- 7 -->
                  <circle cx="20" cy="440" r="11" fill="#121923"></circle><text class="tm sb wf" x="20" y="444.5" font-size="12" text-anchor="middle">7</text>
                  <path class="ln thin" d="M870 414V426"></path>
                  <rect class="node" x="745" y="426" width="250" height="30" rx="3"></rect>
                  <text class="tm" x="760" y="446" font-size="12.5">CloudTrail: agentbox-claude-3</text>
                  <text class="mu" x="1007" y="446" font-size="12.5">the agent session, not you</text>
                
