<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 476" width="1200" height="476" role="img" aria-labelledby="t d">
<title id="t">How an AWS credential reaches the agent</title>
<desc id="d">Sequence: you sign in with AWS SSO on the host; a command in the box asks the CuliBox broker for AWS access; the broker assumes a read-only role with a narrowing session policy; AWS returns temporary credentials; the box gets credentials that expire in 15 minutes; the mint is written to the audit log; CloudTrail records the agent session.</desc>
