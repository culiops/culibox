<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Console</title>
  <link rel="stylesheet" href="/xterm/xterm.css">
  <link rel="stylesheet" href="/vendor/highlight-theme.css">
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --border: #30363d;
      --fg: #e6edf3; --muted: #8b949e; --accent: #2f81f7; --danger: #f85149;
      --fs-code: 12.5px; --fs-md: 14px; --fs-tree: 12px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--fg);
      font: 14px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex; flex-direction: column; height: 100vh;
    }
    header {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
    }
    header .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
    header h1 { font-size: 15px; font-weight: 600; margin: 0; }
    #sidebar-toggle { background: var(--bg); color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 3px 9px; font-size: 14px; line-height: 1; cursor: pointer; }
    #sidebar-toggle:hover { color: var(--fg); border-color: var(--accent); }
    .sidebar-hidden #sidebar { display: none; }
    #hint { display: flex; align-items: center; gap: 8px; padding: 4px 12px; background: var(--panel); border-top: 1px solid var(--border); color: var(--muted); font-size: 11.5px; flex-shrink: 0; }
    #hint.hidden { display: none; }
    #hint button { margin-left: auto; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; padding: 0 2px; }
    #hint button:hover { color: var(--fg); }
    header .spacer { flex: 1; }
    .layouts { display: flex; gap: 4px; }
    .layouts button {
      background: var(--bg); color: var(--muted); border: 1px solid var(--border);
      border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer;
    }
    .layouts button.active { color: #fff; border-color: var(--accent); background: #1f6feb2e; }
    #layout { flex: 1; display: flex; min-height: 0; }
    #sidebar {
      width: 280px; flex-shrink: 0; border-right: 1px solid var(--border);
      background: var(--panel); display: flex; flex-direction: column; min-height: 0;
    }
    #spawn { padding: 14px; border-bottom: 1px solid var(--border); display: grid; gap: 8px; }
    #spawn label { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
    #spawn select, #spawn input, #spawn button {
      background: var(--bg); color: var(--fg); border: 1px solid var(--border);
      border-radius: 6px; padding: 7px 9px; font-size: 13px; font-family: inherit;
    }
    #spawn button { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; font-weight: 600; }
    #options { display: grid; gap: 8px; }
    #options .opt { display: flex; align-items: center; gap: 8px; }
    #options .opt > label { flex: 1; text-transform: none; letter-spacing: 0; color: var(--fg); font-size: 13px; }
    #options .opt input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
    #options .opt select { width: auto; }
    #manage { border-bottom: 1px solid var(--border); font-size: 12.5px; }
    #manage > summary { padding: 10px 14px; cursor: pointer; color: var(--muted); user-select: none; }
    #manage > summary:hover { color: var(--fg); }
    .manage-body { padding: 0 14px 12px; display: grid; gap: 8px; }
    .pf-row { display: flex; align-items: center; gap: 8px; }
    .pf-row > label { flex: 0 0 64px; color: var(--muted); font-size: 12px; text-transform: none; letter-spacing: 0; }
    .pf-row input[type="text"], .pf-row select { flex: 1; background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 5px 7px; font-size: 12.5px; }
    .pf-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
    .pf-lbl { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }
    .manage-body textarea, #pf-secrets { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 7px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; resize: vertical; box-sizing: border-box; }
    #pf-options { display: grid; gap: 6px; }
    .pf-actions { display: flex; gap: 6px; margin-top: 2px; }
    .pf-actions button { flex: 1; background: var(--accent); border: 1px solid var(--accent); color: #fff; border-radius: 6px; padding: 6px; cursor: pointer; font-weight: 600; }
    .pf-actions button.ghost { background: var(--bg); color: var(--fg); border-color: var(--border); flex: 0 0 auto; padding: 6px 12px; font-weight: 400; }
    #editable { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 4px; }
    #editable li { display: flex; align-items: center; gap: 8px; }
    #editable .name { flex: 1; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
    #editable .del { color: var(--danger); border: none; background: none; cursor: pointer; font-size: 15px; }
    #sessions { list-style: none; margin: 0; padding: 8px; overflow-y: auto; flex: 1; }
    #sessions li { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
    #sessions li:hover { background: #1f2630; }
    #sessions li.open { background: #1f6feb2e; outline: 1px solid var(--accent); }
    #sessions .name { flex: 1; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; word-break: break-all; }
    #sessions .badge { font-size: 10px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
    #sessions .kill { color: var(--danger); border: none; background: none; cursor: pointer; font-size: 16px; padding: 2px 6px; }
    #sessions .ren-input { flex: 1; min-width: 0; background: var(--bg); color: var(--fg); border: 1px solid var(--accent); border-radius: 6px; padding: 3px 6px; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
    #sessions li.killing { opacity: 0.55; pointer-events: none; }
    #sessions li.killing .badge { color: var(--danger); border-color: var(--danger); }
    #sessions .empty { color: var(--muted); padding: 10px; font-size: 13px; }
    #grid {
      flex: 1; min-width: 0; display: grid; gap: 6px; padding: 6px; background: #000;
      grid-template-columns: 1fr; grid-auto-rows: 1fr;
    }
    #grid.cols-2 { grid-template-columns: 1fr 1fr; }
    #grid.cols-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    #grid.cols-3 > .cell:nth-child(3) { grid-column: 1 / -1; } /* 2 top · 1 bottom wide */
    #grid.cols-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; } /* 2×2 quad */
    #grid.empty { display: flex; align-items: center; justify-content: center; }
    #grid .placeholder { color: var(--muted); }
    /* cells = grid slots; each holds a stack of tabs (terminal or viewer) */
    .cell { display: flex; flex-direction: column; min-width: 0; min-height: 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: #000; }
    .cell.focused { outline: 1px solid var(--accent); }
    .cell-bar { display: flex; align-items: center; gap: 3px; padding: 3px 5px; background: var(--panel); border-bottom: 1px solid var(--border); overflow-x: auto; }
    .cell-bar .tab { display: flex; align-items: center; gap: 5px; padding: 3px 8px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg); color: var(--muted); font-size: 12px; cursor: pointer; white-space: nowrap; }
    .cell-bar .tab.act { color: #fff; border-color: var(--accent); background: #1f6feb2e; }
    .cell-bar .tab-label { font-family: ui-monospace, Menlo, monospace; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
    .cell-bar .tab-st { font-size: 10px; color: var(--muted); }
    .cell-bar .tab-x { color: var(--muted); border: none; background: none; cursor: pointer; font-size: 14px; line-height: 1; }
    .cell-bar .tab-x:hover { color: var(--danger); }
    .cell-sp { flex: 1; }
    .cell-max, .cell-del { color: var(--muted); border: none; background: none; cursor: pointer; font-size: 13px; padding: 0 4px; }
    .cell-max:hover { color: var(--accent); } .cell-del:hover { color: var(--danger); }
    .cell-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .cell-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; padding: 10px; text-align: center; }
    .tab-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #grid.maximized { grid-template-columns: 1fr !important; grid-template-rows: 1fr !important; }
    /* viewer (code / markdown / image) */
    .viewer-body { background: var(--bg); }
    .viewer-tools { display: flex; align-items: center; gap: 8px; padding: 3px 8px; background: var(--panel); border-bottom: 1px solid var(--border); }
    .viewer-reload { background: var(--bg); color: var(--muted); border: 1px solid var(--border); border-radius: 5px; cursor: pointer; padding: 1px 7px; }
    .viewer-reload:hover { color: var(--fg); border-color: var(--accent); }
    .viewer-auto { background: var(--bg); color: var(--muted); border: 1px solid var(--border); border-radius: 5px; cursor: pointer; padding: 1px 7px; font-size: 11px; }
    .viewer-auto:hover { color: var(--fg); border-color: var(--accent); }
    .viewer-auto.on { color: #fff; border-color: var(--accent); background: #1f6feb2e; }
    .viewer-path { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .viewer-content { flex: 1; min-height: 0; overflow: auto; }
    .viewer-pre { margin: 0; padding: 10px 12px; }
    .viewer-pre code { font-family: ui-monospace, Menlo, monospace; font-size: var(--fs-code); line-height: 1.55; background: none; }
    .viewer-msg { padding: 14px; color: var(--muted); font-size: 13px; }
    .viewer-msg.err { color: var(--danger); }
    .viewer-img { max-width: 100%; max-height: 100%; margin: auto; display: block; object-fit: contain; }
    .viewer-content:has(.viewer-img) { display: flex; align-items: center; justify-content: center; padding: 10px; background: #0d1117; }
    /* markdown */
    .md-body { padding: 14px 18px; font-size: var(--fs-md); line-height: 1.6; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--fg); max-width: 900px; }
    .md-body h1, .md-body h2, .md-body h3 { border-bottom: 1px solid var(--border); padding-bottom: .3em; margin: 1.2em 0 .6em; }
    .md-body h1 { font-size: 1.7em; } .md-body h2 { font-size: 1.4em; } .md-body h3 { font-size: 1.2em; }
    .md-body code { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: .1em .35em; font-family: ui-monospace, Menlo, monospace; font-size: .88em; }
    .md-body pre { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 12px; overflow: auto; }
    .md-body pre code { background: none; border: none; padding: 0; }
    .md-body a { color: var(--accent); } .md-body img { max-width: 100%; }
    .md-body blockquote { border-left: 3px solid var(--border); margin: 0; padding: 0 1em; color: var(--muted); }
    .md-body table { border-collapse: collapse; } .md-body th, .md-body td { border: 1px solid var(--border); padding: 6px 10px; }
    .md-body ul, .md-body ol { padding-left: 1.6em; }
    /* file tree */
    #files { border-bottom: 1px solid var(--border); font-size: 12.5px; }
    #files > summary { padding: 10px 14px; cursor: pointer; color: var(--muted); user-select: none; }
    #files > summary:hover { color: var(--fg); }
    .files-body { padding: 0 10px 10px; display: grid; gap: 6px; }
    .ft-row select, .ft-row input { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 5px 7px; font-size: 12px; }
    #filetree { max-height: 34vh; overflow: auto; font-family: ui-monospace, Menlo, monospace; font-size: var(--fs-tree); }
    .ft-node { padding: 2px 4px; white-space: nowrap; cursor: pointer; border-radius: 4px; color: var(--fg); }
    .ft-node:hover { background: #1f2630; }
    .ft-node.dir { color: var(--accent); }
    .ft-err { color: var(--danger); font-size: 11px; padding: 4px; }
    .pane-term { flex: 1; min-height: 0; padding: 4px; }
    .pane-ended { display: flex; align-items: center; gap: 10px; padding: 5px 10px; background: #2d1618; border-bottom: 1px solid var(--danger); color: var(--danger); font-size: 12px; }
    .pane-ended button { margin-left: auto; background: var(--danger); color: #fff; border: none; border-radius: 6px; padding: 3px 12px; cursor: pointer; font-size: 12px; }
    @media (max-width: 700px) {
      #layout { flex-direction: column; }
      #sidebar { width: 100%; max-height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
      #grid, #grid.cols-2, #grid.cols-3, #grid.cols-4 { grid-template-columns: 1fr; grid-template-rows: none; }
      #grid.cols-3 > .cell:nth-child(3) { grid-column: auto; }
    }
  </style>
  <script>/* apply persisted sidebar state before first paint (no flash) */try{if(localStorage.getItem('sidebarHidden')==='1')document.documentElement.classList.add('sidebar-hidden');}catch(e){}</script>
  <script>/* apply persisted font sizes before first paint (no flash) */try{var _fp=JSON.parse(localStorage.getItem('agent-console:fontPrefs')||'{}');var _d={code:['--fs-code',12.5],markdown:['--fs-md',14],filetree:['--fs-tree',12]};for(var _k in _d){var _v=Number(_fp[_k]);if(!isFinite(_v))_v=_d[_k][1];_v=Math.min(32,Math.max(8,_v));document.documentElement.style.setProperty(_d[_k][0],_v+'px');}}catch(e){}</script>
</head>
<body>
  <header>
    <button id="sidebar-toggle" title="Hide/show sidebar" aria-label="Toggle sidebar">☰</button>
    <span class="dot"></span>
    <h1>Agent Console</h1>
    <span class="spacer"></span>
    <div class="layouts" id="layouts">
      <button data-cols="1">1</button>
      <button data-cols="2">2</button>
      <button data-cols="4" class="active">4</button>
    </div>
  </header>
  <div id="layout">
    <aside id="sidebar">
      <form id="spawn">
        <div>
          <label for="agent">Profile</label>
          <select id="agent"></select>
        </div>
        <div>
          <label for="sess-name">Name (optional)</label>
          <input id="sess-name" type="text" placeholder="auto: working dir name" autocomplete="off" spellcheck="false">
        </div>
        <div id="options"></div>
        <div>
          <label for="workspace">Working dir</label>
          <select id="workspace"></select>
          <input id="cwd-custom" type="text" placeholder="/custom/path" autocomplete="off" style="display:none; margin-top:6px;">
        </div>
        <button type="submit">Spawn session</button>
      </form>
      <details id="manage">
        <summary>Manage profiles</summary>
        <div class="manage-body">
          <div class="pf-row"><label>Name</label><input id="pf-name" type="text" placeholder="my-profile"></div>
          <div class="pf-row"><label>Command</label><input id="pf-bin" type="text" list="pf-bins" placeholder="claude"></div>
          <datalist id="pf-bins"><option value="claude"></option><option value="bash"></option><option value="codex"></option></datalist>
          <div class="pf-row"><label>Base</label>
            <select id="pf-base">
              <option value="inherit">inherit — full env</option>
              <option value="clean">clean — no secrets</option>
              <option value="login">login — source profile</option>
            </select>
          </div>
          <div id="pf-options"></div>
          <label class="pf-lbl">Args (one per line)</label>
          <textarea id="pf-args" rows="2" spellcheck="false" placeholder="--some-flag"></textarea>
          <label class="pf-lbl">Env (KEY=VALUE per line)</label>
          <textarea id="pf-env" rows="2" spellcheck="false" placeholder="FOO=bar"></textarea>
          <label class="pf-lbl">Secrets (comma-separated names)</label>
          <input id="pf-secrets" type="text" placeholder="CLAUDE_CODE_OAUTH_TOKEN">
          <div class="pf-actions">
            <button id="pf-save" type="button">Save profile</button>
            <button id="pf-new" type="button" class="ghost">New</button>
          </div>
          <ul id="editable"></ul>
        </div>
      </details>
      <details id="files" open>
        <summary>Files</summary>
        <div class="files-body">
          <div class="ft-row">
            <select id="ft-root" title="Root folder"></select>
          </div>
          <div class="ft-row">
            <input id="ft-path" type="text" placeholder="paste absolute path… (Enter)" autocomplete="off" spellcheck="false">
          </div>
          <div id="filetree"></div>
        </div>
      </details>
      <ul id="sessions"><li class="empty">Loading…</li></ul>
    </aside>
    <main id="grid" class="empty">
      <div class="placeholder">Spawn or open a session — panes appear here</div>
    </main>
  </div>
  <div id="hint"><span id="hint-text"></span><button id="hint-x" title="Dismiss">×</button></div>
  <script src="/xterm/xterm.js"></script>
  <script src="/xterm/addon-fit.js"></script>
  <script src="/xterm/addon-webgl.js"></script>
  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/highlight.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/fontprefs.js"></script>
  <script src="/terminal-tab.js"></script>
  <script src="/viewer-tab.js"></script>
  <script src="/tabs.js"></script>
  <script src="/filetree.js"></script>
  <script src="/app.js"></script>
</body>
</html>
