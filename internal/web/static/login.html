<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Agent Box</title>
  <link rel="icon" href="data:,"><!-- suppress the /favicon.ico request (would 401 pre-auth) -->
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/primitives.css">
  <style>
    /* Page-specific layout only. The palette comes from tokens.css — this page
       used to keep its own copy, which drifted from the app's. */
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: var(--font-family);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%; max-width: 340px;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 28px 24px;
    }
    h1 { font-size: 18px; margin: 0 0 4px; letter-spacing: .02em; }
    .sub { color: var(--muted); font-size: 12.5px; margin: 0 0 20px; line-height: 1.5; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 6px; }
    input[type=password] {
      width: 100%; background: var(--bg); color: var(--fg);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 10px 12px; font-size: 14px; font-family: inherit;
    }
    button {
      width: 100%; margin-top: 16px;
      background: var(--accent); color: #11111b;
      border: none; border-radius: var(--radius); padding: 10px 12px;
      font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    .err {
      background: var(--danger-tint); border: 1px solid var(--danger);
      color: var(--danger); font-size: 12.5px; border-radius: var(--radius);
      padding: 8px 10px; margin: 0 0 16px;
    }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Agent Box</h1>
    <p class="sub">Sign in to manage your agent sessions on this box.</p>
    <div class="err" id="err" hidden>Wrong password — try again.</div>
    <form method="POST" action="/login">
      <!-- Single operator: the username is fixed and hidden. It exists so a
           password manager can associate the saved credential (the server
           ignores this field and checks only the password). -->
      <input type="text" name="username" value="agent-box" autocomplete="username" hidden>
      <label for="password">Password or login token</label>
      <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
      <button type="submit">Log in</button>
    </form>
  </main>
  <script>
    // The POST handler bounces a failed browser login back to /login?e=1.
    if (new URLSearchParams(location.search).get("e") === "1") {
      document.getElementById("err").hidden = false;
    }
    // Token mode: `agent-box serve` prints /login#token=<token>. The fragment
    // never reaches the server; strip it from the URL bar and history before
    // anything else, then submit it as the password. A wrong token comes back
    // as /login?e=1 with no fragment, so this cannot loop.
    const m = /(?:^|&)token=([A-Za-z0-9_-]+)/.exec(location.hash.slice(1));
    if (m) {
      history.replaceState(null, "", location.pathname + location.search);
      document.getElementById("password").value = m[1];
      document.querySelector("form").submit();
    }
  </script>
</body>
</html>
