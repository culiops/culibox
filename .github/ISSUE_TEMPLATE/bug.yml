name: Bug report
description: Something in agent-box does not work
labels: ["bug"]
body:
  - type: textarea
    id: bundle
    attributes:
      label: Bug report bundle
      description: "Paste the output of `agent-box bug-report` or Settings → About → Report a problem"
    validations:
      required: true
  - type: checkboxes
    id: not-security
    attributes:
      label: Not a security problem
      options:
        - label: This is not a security problem (those go privately to the maintainer)
          required: true
