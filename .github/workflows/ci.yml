# CI: the same checks as scripts/test.sh, on Linux amd64 and arm64, plus a secret scan.
#
# darwin is compile-checked on Linux (job darwin: vet and a build of all four targets,
# CGO off) and its unit tests run natively on a GitHub-hosted Apple silicon runner (job
# darwin-test, CGO off like the shipped binaries). Standard runners are free in a public
# repository. arm64 runners have no nested virtualization, so what needs a VM (colima)
# or a real box stays on the rented Mac. The upgrade test runs on Linux only: on darwin
# the secret store is the login Keychain, which a CI runner cannot use unattended
# (POST /api/store/init times out), so it is tracked apart from #293.
# The abduco-backed Go tests need a real abduco, so it is built from the pinned
# source first, and AGENT_BOX_REQUIRE_ABDUCO=1 turns a missing abduco into a test
# failure instead of a silent skip.
#
# release.yml calls this file (workflow_call), so the checks that gate a release
# are the ones that gate main.
#
# Supply chain (docker/culibox/workflow_test.go guards this):
#   - every action is pinned by full commit SHA, the release in a comment
#   - no pull-request trigger of any kind
#   - GITHUB_TOKEN is read-only for every job: nothing here needs a write grant
#   - the one downloaded tool (gitleaks) is checked against a pinned sha256 first
#   - govulncheck (job vuln, vuln.yml) is installed at an exact version, checked by go's checksum database
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      # Who is calling: release.yml passes "release". It only keeps the concurrency
      # group of a release dry run apart from a manual run of this file.
      caller:
        type: string
        default: ""

permissions:
  contents: read

# Never keyed on github.workflow: when release.yml calls this file the called
# workflow sees the CALLER's github.workflow, so a workflow-keyed group would
# collide with the caller's own and cancel or deadlock it.
# A push run gets a group of its own (its run id), so it is never cancelled: a
# cancelled push run would leave its BEFORE..sha range without a secret scan, and
# GitHub also cancels a PENDING run when a newer one queues in the same group,
# whatever cancel-in-progress says. Other events (manual runs, which go by ref)
# still replace their own older run. The caller input is part of that key: a release
# dry run calls this file as a workflow_dispatch on the same ref as a manual run of
# it, and without the caller they would cancel each other.
concurrency:
  group: ${{ github.event_name == 'push' && format('ci-push-{0}', github.run_id) || format('ci-{0}-{1}', github.ref, inputs.caller) }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      AGENT_BOX_REQUIRE_ABDUCO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The upgrade test builds the previous release tag, so it needs the tags.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install the pinned abduco
        run: |
          scripts/ci/install-abduco.sh "$RUNNER_TEMP/abduco"
          echo "$RUNNER_TEMP/abduco/bin" >> "$GITHUB_PATH"
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt: these files are not formatted:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: go vet
        run: |
          go vet ./...
          go vet -tags upgrade ./internal/upgradetest/
      - name: go test
        run: go test -race ./...
      - name: upgrade test (previous release -> this commit)
        run: |
          AB_UPGRADE_REQUIRE=1 bash scripts/upgrade-test_test.sh
          AB_UPGRADE_REQUIRE=1 bash scripts/upgrade-test.sh

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # The quoted glob is deliberate: `node --test <dir>` is broken on Node >= 22.6.
      - name: node --test
        run: node --test "internal/web/jstest/*.test.js"
      # The release scripts are tested offline against stubs. The test builds
      # tools/release-status, so it needs Go.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # This job installs third-party npm code (eslint). It must never save a Go
          # cache that the test and darwin jobs would restore.
          cache: false
      - name: release scripts
        run: |
          bash scripts/macos-verify_test.sh
          bash scripts/ci/secret-scan_test.sh
      # scripts/lint.sh installs the exact eslint tree from scripts/lint/package-lock.json
      # (npm ci, integrity-checked, no install scripts) and needs python3 (both on the
      # runner). It SKIPS itself when eslint cannot run, which locally keeps an
      # offline session working; in CI a skip would be a check that never ran, so a
      # skip is a failure here. bash gives the pipe pipefail, so a real lint
      # failure still fails the step.
      - name: lint page scripts
        shell: bash
        run: |
          scripts/lint.sh 2>&1 | tee "$RUNNER_TEMP/lint.log"
          if grep -q '^lint: SKIPPED' "$RUNNER_TEMP/lint.log"; then
            echo "::error::scripts/lint.sh skipped itself, so the page scripts were not checked"
            exit 1
          fi

  darwin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: vet darwin
        run: |
          GOOS=darwin GOARCH=arm64 go vet ./...
          GOOS=darwin GOARCH=amd64 go vet ./...
          GOOS=darwin GOARCH=arm64 go vet -tags upgrade ./internal/upgradetest/
      # The uidemo build tag swaps in the demo UI: both vets that scripts/test.sh runs.
      - name: vet uidemo
        run: |
          go vet -tags uidemo ./cmd/culibox
          GOOS=darwin GOARCH=arm64 go vet -tags uidemo ./cmd/culibox
      - name: build every target
        run: |
          for target in "darwin arm64" "darwin amd64" "linux arm64" "linux amd64"; do
            goos=${target% *}
            goarch=${target#* }
            echo "build $goos/$goarch"
            GOOS=$goos GOARCH=$goarch go build -o /dev/null ./cmd/culibox
          done

  # The darwin unit tests, run for real (#293): the shipped darwin binaries are built
  # CGO_ENABLED=0, so the tests are too. The vet and the four-target build stay in the
  # darwin job: they cover darwin/amd64 and the uidemo tag, which this runner does not.
  darwin-test:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
      AGENT_BOX_REQUIRE_ABDUCO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install the pinned abduco
        run: |
          scripts/ci/install-abduco.sh "$RUNNER_TEMP/abduco"
          echo "$RUNNER_TEMP/abduco/bin" >> "$GITHUB_PATH"
      - name: go test
        run: go test ./...

  # govulncheck (#319), in its own file so its weekly schedule runs one Linux job,
  # not this whole workflow.
  vuln:
    uses: ./.github/workflows/vuln.yml

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Full history: a push to main is scanned over the range BEFORE..sha.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The release binary, not a third-party action. Pinned by version and sha256
      # (the Releases API digest of the linux_x64 tarball), checked before use.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -eu
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$dir/gitleaks.tar.gz"
          echo "${GITLEAKS_SHA256}  $dir/gitleaks.tar.gz" | sha256sum -c -
          tar -C "$dir" -xzf "$dir/gitleaks.tar.gz" gitleaks
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/gitleaks" version
      # The custom private-identifier rules in .gitleaks.toml, proven on made-up values
      # with the scanner installed above. The env switch turns a missing scanner into a
      # failure instead of a skip.
      - name: Test the private-identifier rules
        run: GITLEAKS_RULES_TEST_REQUIRE=1 bash scripts/ci/gitleaks-rules_test.sh
      # What is scanned, and why a force-push scans a range since the newest tag, is in
      # scripts/ci/secret-scan.sh. BEFORE reaches it through env, never interpolated.
      - name: Scan for secrets
        env:
          BEFORE: ${{ github.event.before }}
        run: scripts/ci/secret-scan.sh
